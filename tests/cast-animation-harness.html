<!doctype html><html><head><base href="../cast-receiver/"><link rel="stylesheet" href="receiver.css"></head><body>
<main><section id="idle" class="idle"></section><section id="scoreboard" class="scoreboard hidden"></section></main>
<script>
const seen=[];let premature=0;
HTMLVideoElement.prototype.requestVideoFrameCallback=function(callback){const video=this;video._testFrames=(video._testFrames||0)+1;Object.defineProperty(video,'currentTime',{configurable:true,value:video._testFrames*.05});return setTimeout(()=>callback(performance.now(),{presentedFrames:video._testFrames}),8)};
HTMLVideoElement.prototype.cancelVideoFrameCallback=function(id){clearTimeout(id)};
HTMLMediaElement.prototype.play=function(){if(this.dataset.decoderWarm==='1'){setTimeout(()=>this.dispatchEvent(new Event('ended')),2);return Promise.resolve()}if(!seen.includes(this.dataset.effectKey))seen.push(this.dataset.effectKey);setTimeout(()=>{this.dispatchEvent(new Event('playing'));if(this.classList.contains('ready'))premature++},5);setTimeout(()=>this.dispatchEvent(new Event('ended')),30);return Promise.resolve()};
window.cast={framework:{CastReceiverContext:{getInstance:()=>({addCustomMessageListener:(namespace,listener)=>window.sendCast=listener,start:()=>{}})}}};
</script><script src="receiver.js"></script><script>
sendCast({data:{gameId:'audit',status:'active',target:200,round:1,completedRounds:0,roundActive:true,players:[{id:'p1',name:'Audit',score:190,banked:0,roundPoints:190,busted:true,flip7:true,doubled:true,frozen:true,hot:true,nearVictory:true}]}});
setTimeout(()=>document.body.dataset.queue=`${seen.join(',')}|held:${document.querySelectorAll('[data-held-effect-key="p1:electric"]').length}|pre:${document.querySelectorAll('.active-poster').length}|premature:${premature}`,1000);
</script></body></html>
