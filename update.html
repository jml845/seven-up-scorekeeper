<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#071536">
  <title>Updating FlipCast</title>
  <style>
    *{box-sizing:border-box}html,body{height:100%;margin:0}body{display:grid;place-items:center;padding:24px;background:#081017;color:#f6f8f9;font-family:system-ui,-apple-system,sans-serif}.panel{width:min(420px,100%);padding:24px;border:1px solid #ffffff18;border-radius:20px;background:#14212b;text-align:center;box-shadow:0 18px 50px #0007}h1{margin:0 0 9px;font-size:28px}p{margin:0;color:#9fb0bd;line-height:1.5}.spinner{width:38px;height:38px;margin:20px auto;border:4px solid #ffffff1c;border-top-color:#32d5ff;border-radius:50%;animation:spin .8s linear infinite}.button{display:none;margin-top:18px;padding:12px 16px;border:0;border-radius:13px;background:#32d5ff;color:#081017;font:inherit;font-weight:850;text-decoration:none}@keyframes spin{to{transform:rotate(360deg)}}
  </style>
</head>
<body>
  <main class="panel">
    <h1>Updating FlipCast</h1>
    <p id="status">Removing old downloaded app files…</p>
    <div class="spinner" aria-hidden="true"></div>
    <a id="retry" class="button" href="./?updated=69">Open FlipCast</a>
  </main>
  <script>
    (async()=>{
      const status=document.querySelector('#status'),retry=document.querySelector('#retry');
      try{
        if('serviceWorker' in navigator){
          status.textContent='Installing the latest app files…';
          const registration=await navigator.serviceWorker.register('./sw.js?v=69',{updateViaCache:'none'});
          await registration.update();
          const worker=registration.installing||registration.waiting||registration.active;
          if(worker&&worker.state!=='activated'){
            await new Promise((resolve,reject)=>{
              const timeout=setTimeout(()=>reject(new Error('Update activation timed out')),12000);
              worker.addEventListener('statechange',()=>{
                if(worker.state==='installed')worker.postMessage('SKIP_WAITING');
                if(worker.state==='activated'){clearTimeout(timeout);resolve()}
              });
              if(worker.state==='installed')worker.postMessage('SKIP_WAITING');
            });
          }
        }
        status.textContent='Update ready. Opening version 69…';
        location.replace(`./?updated=69&fresh=${Date.now()}`);
      }catch(error){
        status.textContent='The automatic update was blocked. Tap below to reopen FlipCast.';
        document.querySelector('.spinner').style.display='none';
        retry.style.display='inline-block';
      }
    })();
  </script>
</body>
</html>
