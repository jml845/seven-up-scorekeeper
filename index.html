<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#071536">
  <meta name="description" content="Fast game-night scoring with history, statistics, and a live Cast scoreboard.">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="FlipCast">
  <meta name="application-version" content="83">
  <title>FlipCast</title>
  <link rel="manifest" href="manifest.webmanifest?v=83">
  <link rel="icon" href="icon-192.png?v=83" type="image/png">
  <link rel="apple-touch-icon" href="icon-192.png?v=83">
  <link rel="stylesheet" href="styles.css?v=83">
  <link rel="stylesheet" href="ui-enhancements.css?v=83">
  <script src="cast-config.js?v=83"></script>
  <script src="cast-sender.js?v=83"></script>
  <script src="https://www.gstatic.com/cv/js/sender/v1/cast_sender.js?loadCastFramework=1"></script>
</head>
<body>
  <header class="topbar">
    <button class="brand" data-nav="home" aria-label="FlipCast home"><img class="brand-mark" src="icon-192.png?v=83" alt=""><span>FlipCast</span></button>
    <div class="topbar-actions"><button id="installBtn" class="button ghost small hidden">Install</button><button id="castHelpBtn" class="cast-help-button" type="button">Cast Help</button><google-cast-launcher id="castButton" class="cast-launcher" title="Cast scoreboard" aria-label="Cast scoreboard"></google-cast-launcher></div>
  </header>
  <main id="app" tabindex="-1"></main>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <dialog id="confirmDialog">
    <form method="dialog">
      <h2 id="confirmTitle">Are you sure?</h2>
      <p id="confirmText"></p>
      <div class="dialog-actions"><button value="cancel" class="button ghost">Cancel</button><button value="confirm" class="button danger">Confirm</button></div>
    </form>
  </dialog>
  <dialog id="castHelpDialog" class="cast-help-dialog">
    <form method="dialog">
      <h2>Cast help</h2>
      <p id="castHelpStatus">Checking Google Cast…</p>
      <dl id="castDiagnostics" class="cast-diagnostics"></dl>
      <div class="cast-help-copy">
        <strong>If your TV is not listed</strong>
        <ul><li>Use Chrome and connect the phone and TV to the same Wi-Fi.</li><li>Avoid a guest network; disable AP/client isolation in the router.</li><li>Confirm Google Home can see the Cast device.</li></ul>
      </div>
      <div class="dialog-actions cast-help-actions"><button id="castRetryBtn" value="" class="button ghost" type="button">Retry link</button><button id="castCopyBtn" value="" class="button ghost" type="button">Copy diagnostics</button><button id="castHelpClose" value="close" class="button" type="button">Close</button></div>
    </form>
  </dialog>
  <script type="module" src="app.js?v=83"></script>
</body>
</html>
